<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grindin' — Daily HICT Interval Workout Timer</title>
  <meta name="description" content="Hands-free, high-contrast daily interval workout timer with English voice & audio cues built in Rust & WebAssembly.">
  <meta name="theme-color" content="#0d0f12">

  <!-- Favicon with nf-fa-fire (SVG Data URI) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 384 512'%3E%3Cpath fill='%2310b981' d='M216 23.86c0-23.8-30.65-32.77-44.15-13.04C48 191.85 224 200 224 288c0 35.63-29.11 64.49-64.85 63.99-35.17-.5-63.15-29.82-63.15-64.99 0-25.54 13.06-48.63 33.32-61.94 10.9-7.16 7.64-24.16-5.32-26.68C73.08 188.75 32 236.43 32 288c0 88.37 71.63 160 160 160s160-71.63 160-160c0-117.2-96-170.6-136-264.14z'/%3E%3C/svg%3E">
  
  <!-- JetBrains Mono Font Everywhere & Nerd Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://www.nerdfonts.com/assets/css/webfont.css">
  
  <style>
    :root {
      --bg: #090b0e;
      --card-bg: #14171d;
      --card-border: #232936;
      --card-border-focus: #3b4457;
      --text-main: #f3f5f8;
      --text-muted: #8b94a5;
      
      /* Phase Accent Colors */
      --color-work: #10b981;
      --color-work-glow: rgba(16, 185, 129, 0.28);
      --color-rest: #f59e0b;
      --color-rest-glow: rgba(245, 158, 11, 0.28);
      --color-warmup: #06b6d4;
      --color-warmup-glow: rgba(6, 182, 212, 0.28);
      --color-cooldown: #8b5cf6;
      --color-cooldown-glow: rgba(139, 92, 246, 0.28);
      
      --accent: var(--color-work);
      --accent-glow: var(--color-work-glow);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'JetBrains Mono', monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.4s ease;
    }

    /* Dynamic Body States */
    body.phase-work { --accent: var(--color-work); --accent-glow: var(--color-work-glow); }
    body.phase-rest { --accent: var(--color-rest); --accent-glow: var(--color-rest-glow); }
    body.phase-warmup { --accent: var(--color-warmup); --accent-glow: var(--color-warmup-glow); }
    body.phase-cooldown { --accent: var(--color-cooldown); --accent-glow: var(--color-cooldown-glow); }
    body.phase-inter-round { --accent: #ec4899; --accent-glow: rgba(236, 72, 153, 0.28); }

    /* Nerd Font Icon Styling (preserves NF glyph mapping) */
    .nf {
      font-family: 'Symbols Nerd Font', 'JetBrainsMono Nerd Font', 'NerdFontsSymbols', monospace !important;
      font-style: normal;
      display: inline-block;
      text-decoration: inherit;
      font-size: 1.15em;
      line-height: 1;
      vertical-align: -0.1em;
    }

    /* Top Navigation */
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      background: rgba(13, 15, 18, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-logo .nf {
      font-size: 1.4rem;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .icon-btn:hover, .icon-btn:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      outline: none;
    }

    /* Day Selector Tabs */
    .day-strip {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--card-border);
      background: #0d0f14;
    }

    .day-strip::-webkit-scrollbar {
      display: none;
    }

    .day-chip {
      padding: 8px 16px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .day-chip:hover, .day-chip:focus-visible {
      border-color: var(--accent);
      color: var(--text-main);
      outline: none;
    }

    .day-chip.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 800;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    /* Main Timer Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .routine-banner {
      margin-bottom: 14px;
    }

    .routine-day {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--accent);
      font-weight: 800;
    }

    .routine-focus {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 2px;
    }

    /* Giant Phase Badge */
    .phase-badge {
      display: inline-block;
      padding: 6px 22px;
      border-radius: 999px;
      background: var(--accent);
      color: #000;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      box-shadow: 0 0 25px var(--accent-glow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* GIANT TIMER DISPLAY */
    .timer-display {
      margin: 10px 0;
      font-size: clamp(6.5rem, 24vw, 13rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
    }

    /* Movement Title */
    .movement-title {
      font-size: clamp(1.5rem, 5.2vw, 2.6rem);
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
      max-width: 90%;
      min-height: 2.4em;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
    }

    /* Next Up Card */
    .next-up-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 0.9rem;
      color: var(--text-muted);
      max-width: 480px;
      width: 90%;
      margin-bottom: 20px;
      transition: opacity 0.3s;
    }

    .next-up-card span {
      color: var(--text-main);
      font-weight: 700;
    }

    /* Progress Stats Pills */
    .progress-stats {
      display: flex;
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .stat-pill b {
      color: var(--accent);
    }

    /* Control Buttons */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
    }

    .btn-secondary {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.25rem;
      transition: all 0.2s;
    }

    .btn-secondary:hover, .btn-secondary:focus-visible {
      border-color: var(--accent);
      transform: scale(1.05);
      outline: none;
    }

    .btn-primary {
      padding: 0 42px;
      height: 68px;
      border-radius: 34px;
      background: var(--accent);
      color: #000;
      border: none;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 25px var(--accent-glow);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    .btn-primary:focus-visible {
      outline: 3px solid var(--text-main);
      outline-offset: 4px;
    }

    /* Routine Move List Bar */
    .move-timeline {
      width: 100%;
      max-width: 600px;
      padding: 10px 20px 24px;
      display: flex;
      gap: 6px;
    }

    .timeline-segment {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #1f242e;
      transition: background 0.3s;
    }

    .timeline-segment.active {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .timeline-segment.completed {
      background: #4b5563;
    }

    /* Drawer / Modal Settings */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      background: #12151b;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.85);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .close-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .close-btn:hover, .close-btn:focus-visible {
      color: var(--text-main);
      border-color: var(--accent);
      outline: none;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Custom Number Stepper with Styled Arrows */
    .number-stepper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    input[type="number"], input[type="text"], select {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    /* Hide browser default spin buttons */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
      padding-right: 42px; /* Prevent text overlap with custom arrows */
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Up / Down Arrow Steppers */
    .stepper-arrow-group {
      position: absolute;
      right: 4px;
      top: 4px;
      bottom: 4px;
      width: 32px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stepper-arrow {
      flex: 1;
      background: #181d26;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all 0.15s ease;
    }

    .stepper-arrow:hover, .stepper-arrow:focus-visible {
      background: #232936;
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      outline: none;
    }

    .stepper-arrow:active {
      background: var(--accent);
      color: #000;
      transform: scale(0.92);
    }

    .stepper-arrow .nf {
      font-size: 0.65rem;
      line-height: 1;
      vertical-align: 0;
    }

    .moves-edit-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .move-item-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .move-idx-badge {
      width: 28px;
      height: 28px;
      background: var(--card-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .btn-save-settings {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-save-settings:hover, .btn-save-settings:focus-visible {
      box-shadow: 0 0 18px var(--accent-glow);
      outline: none;
    }

    /* Accessibility: Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="phase-work">

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <i class="nf nf-fa-fire"></i>
      </div>
      <h1 class="brand-title">Grindin'</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="audioToggleBtn" title="Toggle Audio Voice & Beeps" aria-label="Toggle Audio Voice and Sound Effects">
        <i class="nf nf-fa-volume_up" id="audioIcon" aria-hidden="true"></i> Audio
      </button>
      <button class="icon-btn" id="settingsBtn" title="Workout & Movement Setup" aria-label="Open Workout Setup Modal">
        <i class="nf nf-fa-cog" aria-hidden="true"></i> Setup
      </button>
    </div>
  </header>

  <!-- Day Selector Strip -->
  <nav class="day-strip" id="dayStrip" aria-label="Daily Workout Schedule Tabs">
    <button type="button" class="day-chip" data-day="senin" aria-label="Monday Workout">Mon</button>
    <button type="button" class="day-chip" data-day="selasa" aria-label="Tuesday Workout">Tue</button>
    <button type="button" class="day-chip" data-day="rabu" aria-label="Wednesday Workout">Wed</button>
    <button type="button" class="day-chip" data-day="kamis" aria-label="Thursday Workout">Thu</button>
    <button type="button" class="day-chip" data-day="jumat" aria-label="Friday Workout">Fri</button>
    <button type="button" class="day-chip" data-day="sabtu" aria-label="Saturday Workout">Sat</button>
    <button type="button" class="day-chip" data-day="minggu" aria-label="Sunday Workout">Sun</button>
  </nav>

  <!-- Main Workout View -->
  <main>
    <div class="routine-banner">
      <div class="routine-day" id="routineDayText">SATURDAY</div>
      <div class="routine-focus" id="routineFocusText">Total Body Strength</div>
    </div>

    <div class="phase-badge" id="phaseBadge" role="status" aria-live="polite">GET READY</div>

    <!-- Giant Numbers -->
    <div class="timer-display" id="timerDisplay" role="timer" aria-live="off" aria-label="Seconds remaining">40</div>

    <!-- Movement Name -->
    <div class="movement-title" id="movementTitle" role="heading" aria-level="2">Curtsy Lunge</div>

    <!-- Next Up Card during Rest -->
    <div class="next-up-card" id="nextUpCard" aria-live="polite">
      Next Up: <span id="nextMoveText">Hand-Release Push-Up</span>
    </div>

    <!-- Stats -->
    <div class="progress-stats">
      <div class="stat-pill">ROUND: <b id="roundText">1 / 2</b></div>
      <div class="stat-pill">EXERCISE: <b id="moveIdxText">1 / 5</b></div>
    </div>

    <!-- Move Timeline Progress Bar -->
    <div class="move-timeline" id="moveTimeline" aria-hidden="true">
      <div class="timeline-segment active"></div>
      <div class="timeline-segment"></div>
      <div class="timeline-segment"></div>
      <div class="timeline-segment"></div>
      <div class="timeline-segment"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button type="button" class="btn-secondary" id="resetBtn" title="Reset Timer" aria-label="Reset Timer">
        <i class="nf nf-md-reload" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn-primary" id="startBtn" aria-label="Start Workout">
        <i class="nf nf-fa-play" id="playIcon" aria-hidden="true"></i>
        <span id="playText">START</span>
      </button>
      <button type="button" class="btn-secondary" id="skipBtn" title="Skip Interval" aria-label="Skip Current Interval">
        <i class="nf nf-fa-forward_step" aria-hidden="true"></i>
      </button>
    </div>
  </main>

  <!-- Settings / Customizer Modal (A11y Compliant) -->
  <div class="modal-overlay" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">
          <i class="nf nf-fa-sliders" aria-hidden="true"></i> Workout Setup
        </h2>
        <button type="button" class="close-btn" id="closeSettingsBtn" title="Close" aria-label="Close Setup Modal">
          <i class="nf nf-md-close" aria-hidden="true"></i>
        </button>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputWorkDuration">Work Time (seconds, step 5)</label>
          <div class="number-stepper">
            <input type="number" id="inputWorkDuration" value="40" min="5" max="300" step="5" aria-label="Work duration in seconds">
            <div class="stepper-arrow-group">
              <button type="button" class="stepper-arrow up" data-target="inputWorkDuration" data-dir="1" aria-label="Increase Work Time by 5 seconds">
                <i class="nf nf-fa-chevron_up" aria-hidden="true"></i>
              </button>
              <button type="button" class="stepper-arrow down" data-target="inputWorkDuration" data-dir="-1" aria-label="Decrease Work Time by 5 seconds">
                <i class="nf nf-fa-chevron_down" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="inputRestDuration">Rest Time (seconds, step 5)</label>
          <div class="number-stepper">
            <input type="number" id="inputRestDuration" value="20" min="5" max="180" step="5" aria-label="Rest duration in seconds">
            <div class="stepper-arrow-group">
              <button type="button" class="stepper-arrow up" data-target="inputRestDuration" data-dir="1" aria-label="Increase Rest Time by 5 seconds">
                <i class="nf nf-fa-chevron_up" aria-hidden="true"></i>
              </button>
              <button type="button" class="stepper-arrow down" data-target="inputRestDuration" data-dir="-1" aria-label="Decrease Rest Time by 5 seconds">
                <i class="nf nf-fa-chevron_down" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputInterRoundRest">Round Break (seconds, step 5)</label>
          <div class="number-stepper">
            <input type="number" id="inputInterRoundRest" value="35" min="5" max="300" step="5" aria-label="Round Break duration in seconds">
            <div class="stepper-arrow-group">
              <button type="button" class="stepper-arrow up" data-target="inputInterRoundRest" data-dir="1" aria-label="Increase Round Break by 5 seconds">
                <i class="nf nf-fa-chevron_up" aria-hidden="true"></i>
              </button>
              <button type="button" class="stepper-arrow down" data-target="inputInterRoundRest" data-dir="-1" aria-label="Decrease Round Break by 5 seconds">
                <i class="nf nf-fa-chevron_down" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="inputTotalRounds">Total Rounds</label>
          <div class="number-stepper">
            <input type="number" id="inputTotalRounds" value="2" min="1" max="10" step="1" aria-label="Total number of rounds">
            <div class="stepper-arrow-group">
              <button type="button" class="stepper-arrow up" data-target="inputTotalRounds" data-dir="1" aria-label="Increase Total Rounds by 1">
                <i class="nf nf-fa-chevron_up" aria-hidden="true"></i>
              </button>
              <button type="button" class="stepper-arrow down" data-target="inputTotalRounds" data-dir="-1" aria-label="Decrease Total Rounds by 1">
                <i class="nf nf-fa-chevron_down" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputWarmupDuration">Warm-up (seconds, step 5)</label>
          <div class="number-stepper">
            <input type="number" id="inputWarmupDuration" value="60" min="0" max="300" step="5" aria-label="Warm-up duration in seconds">
            <div class="stepper-arrow-group">
              <button type="button" class="stepper-arrow up" data-target="inputWarmupDuration" data-dir="1" aria-label="Increase Warm-up by 5 seconds">
                <i class="nf nf-fa-chevron_up" aria-hidden="true"></i>
              </button>
              <button type="button" class="stepper-arrow down" data-target="inputWarmupDuration" data-dir="-1" aria-label="Decrease Warm-up by 5 seconds">
                <i class="nf nf-fa-chevron_down" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="inputCooldownDuration">Cool-down (seconds, step 5)</label>
          <div class="number-stepper">
            <input type="number" id="inputCooldownDuration" value="60" min="0" max="300" step="5" aria-label="Cool-down duration in seconds">
            <div class="stepper-arrow-group">
              <button type="button" class="stepper-arrow up" data-target="inputCooldownDuration" data-dir="1" aria-label="Increase Cool-down by 5 seconds">
                <i class="nf nf-fa-chevron_up" aria-hidden="true"></i>
              </button>
              <button type="button" class="stepper-arrow down" data-target="inputCooldownDuration" data-dir="-1" aria-label="Decrease Cool-down by 5 seconds">
                <i class="nf nf-fa-chevron_down" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Edit 5 Exercises (<span id="editDayLabel">Saturday</span>):</label>
        <div class="moves-edit-list" id="movesEditList">
          <!-- Populated dynamically -->
        </div>
      </div>

      <button type="button" class="btn-save-settings" id="saveSettingsBtn">
        <i class="nf nf-fa-check" aria-hidden="true"></i> Save & Apply
      </button>
    </div>
  </div>

  <script>
    /*
     * Grindin' Hybrid Client Core
     * ponytail: Fallback JS implementation mirrors the Rust state machine exactly,
     * ensuring immediate local execution and zero-friction GitHub Pages runtime.
     */

    // --- DEFAULT SCHEDULE FROM USER'S NOTES ---
    const DEFAULT_SCHEDULE = {
      senin: {
        title: "Monday",
        focus: "Lower Body & Core",
        moves: ["Squat", "Reverse Lunge", "Glute Bridge", "Plank Shoulder Tap", "Bicycle Crunch"]
      },
      selasa: {
        title: "Tuesday",
        focus: "Upper Body & Cardio",
        moves: ["Push-Up", "Mountain Climber", "Pike Push-Up / Downward Dog", "Skater Steps", "Dead Bug"]
      },
      rabu: {
        title: "Wednesday",
        focus: "Full-Body Functional",
        moves: ["Sumo Squat", "Inchworm", "Bear Crawl Hold", "Lunge to Knee Drive", "High Plank"]
      },
      kamis: {
        title: "Thursday",
        focus: "Core Stability & Posture",
        moves: ["Bird-Dog", "Side Plank (Right/Left)", "Glute Bridge March", "Superman Hold", "Cat-Cow"]
      },
      jumat: {
        title: "Friday",
        focus: "HIIT Fat Burn",
        moves: ["Squat to Calf Raise", "Speed Skaters", "Push-Up to T-Rotation", "High Marching", "Hollow Tuck"]
      },
      sabtu: {
        title: "Saturday",
        focus: "Total Body Strength",
        moves: ["Curtsy Lunge", "Hand-Release Push-Up", "Tabletop Bridge", "Mountain Climber", "Forearm Plank"]
      },
      minggu: {
        title: "Sunday",
        focus: "Mobility & Active Core",
        moves: ["Dead Bug", "Bird-Dog", "Glute Bridge Hold", "Child's Pose", "Thoracic Stretch"]
      }
    };

    // Load from LocalStorage or default
    let schedule = JSON.parse(localStorage.getItem('grindin_schedule')) || DEFAULT_SCHEDULE;
    let config = JSON.parse(localStorage.getItem('grindin_config')) || {
      workDuration: 40,
      restDuration: 20,
      interRoundRest: 35,
      totalRounds: 2,
      warmupDuration: 60,
      cooldownDuration: 60,
      audioEnabled: true
    };

    // Determine current day key
    const daysMap = ['minggu', 'senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu'];
    let currentDayKey = daysMap[new Date().getDay()];

    // State Variables
    let currentPhase = 'IDLE'; // IDLE, WARMUP, WORK, REST, INTER_ROUND, COOLDOWN, FINISHED
    let isRunning = false;
    let timeRemaining = config.workDuration;
    let currentRound = 1;
    let currentMoveIdx = 0;
    let halfwayNotified = false;
    let timerInterval = null;
    let wakeLock = null;

    // Web Audio Synthesizer
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration = 0.2, type = 'sine', gainVal = 0.3) {
      if (!config.audioEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(gainVal, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {
        console.warn('Audio tone err:', e);
      }
    }

    // Speech Synthesizer (English voice)
    function speak(text) {
      if (!config.audioEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 1.05;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // Keep Screen Awake via Wake Lock API
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('WakeLock error:', err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    // DOM Elements
    const body = document.body;
    const timerDisplay = document.getElementById('timerDisplay');
    const phaseBadge = document.getElementById('phaseBadge');
    const movementTitle = document.getElementById('movementTitle');
    const nextUpCard = document.getElementById('nextUpCard');
    const nextMoveText = document.getElementById('nextMoveText');
    const roundText = document.getElementById('roundText');
    const moveIdxText = document.getElementById('moveIdxText');
    const routineDayText = document.getElementById('routineDayText');
    const routineFocusText = document.getElementById('routineFocusText');
    const startBtn = document.getElementById('startBtn');
    const playText = document.getElementById('playText');
    const playIcon = document.getElementById('playIcon');
    const resetBtn = document.getElementById('resetBtn');
    const skipBtn = document.getElementById('skipBtn');
    const audioToggleBtn = document.getElementById('audioToggleBtn');
    const audioIcon = document.getElementById('audioIcon');
    const moveTimeline = document.getElementById('moveTimeline');

    // UI Updates
    function updateUI() {
      const routine = schedule[currentDayKey];
      routineDayText.textContent = routine.title.toUpperCase();
      routineFocusText.textContent = routine.focus;

      timerDisplay.textContent = timeRemaining;
      roundText.textContent = `${currentRound} / ${config.totalRounds}`;
      moveIdxText.textContent = `${currentMoveIdx + 1} / ${routine.moves.length}`;

      // Update Phase Styling and Badges
      body.className = '';
      if (currentPhase === 'WORK') {
        body.classList.add('phase-work');
        phaseBadge.textContent = 'WORK';
        movementTitle.textContent = routine.moves[currentMoveIdx];
        nextUpCard.style.opacity = '0.4';
      } else if (currentPhase === 'REST') {
        body.classList.add('phase-rest');
        phaseBadge.textContent = 'REST';
        movementTitle.textContent = 'Catch Your Breath';
        nextUpCard.style.opacity = '1';
        const nextIdx = currentMoveIdx + 1;
        const nextMoveName = nextIdx < routine.moves.length ? routine.moves[nextIdx] : (currentRound < config.totalRounds ? routine.moves[0] : 'Cool-down');
        nextMoveText.textContent = nextMoveName;
      } else if (currentPhase === 'INTER_ROUND') {
        body.classList.add('phase-inter-round');
        phaseBadge.textContent = 'ROUND BREAK';
        movementTitle.textContent = `Round ${currentRound} Complete!`;
        nextUpCard.style.opacity = '1';
        nextMoveText.textContent = `(Round ${currentRound + 1}) ${routine.moves[0]}`;
      } else if (currentPhase === 'WARMUP') {
        body.classList.add('phase-warmup');
        phaseBadge.textContent = 'WARM-UP';
        movementTitle.textContent = 'Arm Circles, Hip Circles & Marching';
        nextUpCard.style.opacity = '1';
        nextMoveText.textContent = routine.moves[0];
      } else if (currentPhase === 'COOLDOWN') {
        body.classList.add('phase-cooldown');
        phaseBadge.textContent = 'COOL-DOWN';
        movementTitle.textContent = "Child's Pose & Stretching";
        nextUpCard.style.opacity = '0';
      } else if (currentPhase === 'FINISHED') {
        body.classList.add('phase-work');
        phaseBadge.textContent = 'WORKOUT FINISHED!';
        movementTitle.innerHTML = '<i class="nf nf-fa-trophy" aria-hidden="true"></i> Fantastic Job Today!';
        nextUpCard.style.opacity = '0';
      } else {
        // IDLE
        body.classList.add('phase-work');
        phaseBadge.textContent = 'GET READY';
        movementTitle.textContent = routine.moves[0];
        nextUpCard.style.opacity = '0.8';
        nextMoveText.textContent = routine.moves[0];
      }

      // Update Move Timeline Bar
      renderTimeline();

      // Controls State
      if (isRunning) {
        playText.textContent = 'PAUSE';
        playIcon.className = 'nf nf-fa-pause';
        startBtn.setAttribute('aria-label', 'Pause Workout');
      } else {
        playText.textContent = currentPhase === 'IDLE' ? 'START' : 'RESUME';
        playIcon.className = 'nf nf-fa-play';
        startBtn.setAttribute('aria-label', currentPhase === 'IDLE' ? 'Start Workout' : 'Resume Workout');
      }
    }

    function renderTimeline() {
      const routine = schedule[currentDayKey];
      moveTimeline.innerHTML = '';
      routine.moves.forEach((_, idx) => {
        const seg = document.createElement('div');
        seg.className = 'timeline-segment';
        if (idx === currentMoveIdx && currentPhase === 'WORK') {
          seg.classList.add('active');
        } else if (idx < currentMoveIdx) {
          seg.classList.add('completed');
        }
        moveTimeline.appendChild(seg);
      });
    }

    // State Transitions
    function startWork() {
      currentPhase = 'WORK';
      timeRemaining = config.workDuration;
      halfwayNotified = false;
      const routine = schedule[currentDayKey];
      const mv = routine.moves[currentMoveIdx];
      updateUI();
      playTone(1174.66, 0.4); // D6 Chime
      speak(`${mv}, let's go!`);
    }

    function startRest() {
      currentPhase = 'REST';
      timeRemaining = config.restDuration;
      const routine = schedule[currentDayKey];
      const nextIdx = currentMoveIdx + 1;
      const nextMv = nextIdx < routine.moves.length ? routine.moves[nextIdx] : routine.moves[0];
      updateUI();
      playTone(392.0, 0.35); // G4 Tone
      speak(`Rest for ${config.restDuration} seconds. Next up: ${nextMv}`);
    }

    function startInterRoundRest() {
      currentPhase = 'INTER_ROUND';
      timeRemaining = config.interRoundRest;
      const routine = schedule[currentDayKey];
      updateUI();
      playTone(392.0, 0.4);
      speak(`Round ${currentRound} complete! Long rest for ${config.interRoundRest} seconds. Next up: ${routine.moves[0]}`);
    }

    function startCooldown() {
      currentPhase = 'COOLDOWN';
      timeRemaining = config.cooldownDuration;
      updateUI();
      playTone(880.0, 0.4);
      speak("Cool down for one minute. Deep breaths and stretch.");
    }

    function finishWorkout() {
      currentPhase = 'FINISHED';
      isRunning = false;
      timeRemaining = 0;
      clearInterval(timerInterval);
      releaseWakeLock();
      updateUI();
      playTone(1318.51, 0.6);
      speak("Workout complete! Fantastic job today!");
    }

    // Tick Engine
    function tick() {
      if (!isRunning) return;

      // 3-2-1 Countdown Beeps
      if (timeRemaining <= 3 && timeRemaining > 0) {
        playTone(880.0, 0.15); // A5 pip
      }

      // Halfway Alert (at 50% of work duration)
      if (currentPhase === 'WORK' && !halfwayNotified) {
        const half = Math.floor(config.workDuration / 2);
        if (timeRemaining <= half) {
          halfwayNotified = true;
          playTone(659.25, 0.25);
          speak("Halfway through! Keep pushing!");
        }
      }

      if (timeRemaining > 0) {
        timeRemaining--;
        timerDisplay.textContent = timeRemaining;
      }

      if (timeRemaining === 0) {
        advancePhase();
      }
    }

    function advancePhase() {
      const routine = schedule[currentDayKey];

      if (currentPhase === 'WARMUP') {
        currentMoveIdx = 0;
        startWork();
      } else if (currentPhase === 'WORK') {
        const isLastMoveInRound = currentMoveIdx + 1 >= routine.moves.length;
        if (isLastMoveInRound) {
          if (currentRound >= config.totalRounds) {
            if (config.cooldownDuration > 0) {
              startCooldown();
            } else {
              finishWorkout();
            }
          } else {
            startInterRoundRest();
          }
        } else {
          startRest();
        }
      } else if (currentPhase === 'REST') {
        currentMoveIdx++;
        startWork();
      } else if (currentPhase === 'INTER_ROUND') {
        currentRound++;
        currentMoveIdx = 0;
        startWork();
      } else if (currentPhase === 'COOLDOWN') {
        finishWorkout();
      }
    }

    // Controls Handling
    function handleStartPause() {
      initAudio();
      requestWakeLock();

      if (!isRunning) {
        isRunning = true;
        if (currentPhase === 'IDLE' || currentPhase === 'FINISHED') {
          currentRound = 1;
          currentMoveIdx = 0;
          if (config.warmupDuration > 0) {
            currentPhase = 'WARMUP';
            timeRemaining = config.warmupDuration;
            speak("One minute warm-up. Get ready to move!");
            playTone(1174.66, 0.4);
          } else {
            startWork();
          }
        }
        clearInterval(timerInterval);
        timerInterval = setInterval(tick, 1000);
      } else {
        isRunning = false;
        clearInterval(timerInterval);
        releaseWakeLock();
      }
      updateUI();
    }

    function handleReset() {
      isRunning = false;
      clearInterval(timerInterval);
      releaseWakeLock();
      currentPhase = 'IDLE';
      currentRound = 1;
      currentMoveIdx = 0;
      timeRemaining = config.workDuration;
      halfwayNotified = false;
      updateUI();
    }

    function handleSkip() {
      initAudio();
      if (currentPhase !== 'IDLE' && currentPhase !== 'FINISHED') {
        timeRemaining = 0;
        advancePhase();
        updateUI();
      }
    }

    // Day Selection
    function selectDay(key) {
      if (isRunning) {
        if (!confirm("Workout is active. Reset and change day?")) return;
        handleReset();
      }
      currentDayKey = key;
      document.querySelectorAll('.day-chip').forEach(chip => {
        const isActive = chip.dataset.day === key;
        chip.classList.toggle('active', isActive);
        chip.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });
      handleReset();
    }

    // Settings Modal & Focus Management (A11y)
    const settingsModal = document.getElementById('settingsModal');
    const settingsBtn = document.getElementById('settingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const movesEditList = document.getElementById('movesEditList');
    const editDayLabel = document.getElementById('editDayLabel');
    let previousActiveElement = null;

    function openSettings() {
      previousActiveElement = document.activeElement;
      const routine = schedule[currentDayKey];
      editDayLabel.textContent = routine.title;
      document.getElementById('inputWorkDuration').value = config.workDuration;
      document.getElementById('inputRestDuration').value = config.restDuration;
      document.getElementById('inputInterRoundRest').value = config.interRoundRest;
      document.getElementById('inputTotalRounds').value = config.totalRounds;
      document.getElementById('inputWarmupDuration').value = config.warmupDuration;
      document.getElementById('inputCooldownDuration').value = config.cooldownDuration;

      movesEditList.innerHTML = '';
      routine.moves.forEach((m, idx) => {
        const row = document.createElement('div');
        row.className = 'move-item-row';
        row.innerHTML = `
          <div class="move-idx-badge" aria-hidden="true">${idx + 1}</div>
          <input type="text" class="move-input-field" value="${m}" aria-label="Exercise ${idx + 1} Name" style="flex:1;">
        `;
        movesEditList.appendChild(row);
      });

      settingsModal.classList.add('open');
      document.getElementById('inputWorkDuration').focus();
    }

    function closeSettings() {
      settingsModal.classList.remove('open');
      if (previousActiveElement && typeof previousActiveElement.focus === 'function') {
        previousActiveElement.focus();
      }
    }

    function saveSettings() {
      config.workDuration = parseInt(document.getElementById('inputWorkDuration').value, 10) || 40;
      config.restDuration = parseInt(document.getElementById('inputRestDuration').value, 10) || 20;
      config.interRoundRest = parseInt(document.getElementById('inputInterRoundRest').value, 10) || 35;
      config.totalRounds = parseInt(document.getElementById('inputTotalRounds').value, 10) || 2;
      config.warmupDuration = parseInt(document.getElementById('inputWarmupDuration').value, 10) || 0;
      config.cooldownDuration = parseInt(document.getElementById('inputCooldownDuration').value, 10) || 0;

      const inputs = movesEditList.querySelectorAll('.move-input-field');
      const updatedMoves = [];
      inputs.forEach(inp => {
        if (inp.value.trim()) updatedMoves.push(inp.value.trim());
      });
      if (updatedMoves.length > 0) {
        schedule[currentDayKey].moves = updatedMoves;
      }

      localStorage.setItem('grindin_config', JSON.stringify(config));
      localStorage.setItem('grindin_schedule', JSON.stringify(schedule));

      closeSettings();
      handleReset();
    }

    // Custom Stepper Arrow Logic (Supports Step of 5 & Smooth Repeated Clicking)
    function setupSteppers() {
      const arrows = document.querySelectorAll('.stepper-arrow');
      arrows.forEach(arrow => {
        const targetId = arrow.dataset.target;
        const dir = parseInt(arrow.dataset.dir, 10);
        const input = document.getElementById(targetId);
        if (!input) return;

        function stepValue() {
          const step = parseInt(input.getAttribute('step') || '1', 10);
          const min = parseInt(input.getAttribute('min') || '0', 10);
          const max = parseInt(input.getAttribute('max') || '999', 10);
          let current = parseInt(input.value, 10);
          if (isNaN(current)) current = min;

          let next = current + (dir * step);
          if (next < min) next = min;
          if (next > max) next = max;

          input.value = next;
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.dispatchEvent(new Event('change', { bubbles: true }));
        }

        let holdTimeout = null;
        let repeatInterval = null;

        function startStepping(e) {
          e.preventDefault();
          stepValue();
          holdTimeout = setTimeout(() => {
            repeatInterval = setInterval(stepValue, 100);
          }, 320);
        }

        function stopStepping() {
          clearTimeout(holdTimeout);
          clearInterval(repeatInterval);
        }

        arrow.addEventListener('mousedown', startStepping);
        arrow.addEventListener('mouseup', stopStepping);
        arrow.addEventListener('mouseleave', stopStepping);
        arrow.addEventListener('touchstart', startStepping, { passive: false });
        arrow.addEventListener('touchend', stopStepping);
        arrow.addEventListener('touchcancel', stopStepping);

        // Keyboard activation on stepper buttons
        arrow.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            stepValue();
          }
        });
      });
    }

    // Modal Keyboard Trap & Escape Listener
    settingsModal.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeSettings();
        return;
      }

      if (e.key === 'Tab') {
        const focusable = settingsModal.querySelectorAll('button, input, select, [tabindex="0"]');
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    });

    // Event Listeners
    startBtn.addEventListener('click', handleStartPause);
    resetBtn.addEventListener('click', handleReset);
    skipBtn.addEventListener('click', handleSkip);
    settingsBtn.addEventListener('click', openSettings);
    closeSettingsBtn.addEventListener('click', closeSettings);
    saveSettingsBtn.addEventListener('click', saveSettings);

    audioToggleBtn.addEventListener('click', () => {
      config.audioEnabled = !config.audioEnabled;
      audioIcon.className = config.audioEnabled ? 'nf nf-fa-volume_up' : 'nf nf-fa-volume_off';
      audioToggleBtn.setAttribute('aria-label', config.audioEnabled ? 'Mute Audio' : 'Unmute Audio');
      localStorage.setItem('grindin_config', JSON.stringify(config));
    });

    document.querySelectorAll('.day-chip').forEach(chip => {
      chip.addEventListener('click', () => selectDay(chip.dataset.day));
    });

    // Initialize Stepper Arrows
    setupSteppers();

    // Auto-select Today on load
    selectDay(currentDayKey);
  </script>
